<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC 实时监控系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* 头部 */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid #2a2a3e;
  }
  .header h1 { font-size: 22px; font-weight: 600; color: #f0f0f0; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #999;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ef5350; transition: background 0.3s;
  }
  .status-dot.connected { background: #4caf50; box-shadow: 0 0 8px rgba(76,175,80,0.5); }

  /* 统计栏 */
  .stats {
    display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .stat-card {
    background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px;
    padding: 14px 20px; flex: 1; min-width: 140px;
  }
  .stat-card .label { font-size: 12px; color: #888; }
  .stat-card .value { font-size: 22px; font-weight: 600; color: #f0f0f0; margin-top: 4px; }

  /* 变量卡片网格 */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px;
    padding: 16px; transition: border-color 0.2s;
  }
  .card:hover { border-color: #3a3a5e; }
  .card .label {
    font-size: 13px; color: #888; margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  .card .label .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(107,99,255,0.15); color: #8b83ff;
  }
  .card .label .tag.writable { background: rgba(76,175,80,0.15); color: #81c784; }
  .card .value {
    font-size: 28px; font-weight: 500; color: #f0f0f0;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
  }
  .card .value.bool-true { color: #4caf50; }
  .card .value.bool-false { color: #ef5350; }

  /* 控制区 */
  .controls { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .controls input {
    background: #0a0a14; border: 1px solid #333;
    color: #fff; padding: 6px 10px; border-radius: 4px;
    width: 80px; font-size: 14px; font-family: monospace;
  }
  .controls input:focus { outline: none; border-color: #8b83ff; }
  .btn {
    padding: 6px 16px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: opacity 0.2s; color: #fff;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #2196f3; }
  .btn-primary:hover:not(:disabled) { background: #1976d2; }
  .btn-success { background: #4caf50; }
  .btn-success:hover:not(:disabled) { background: #388e3c; }
  .btn-danger { background: #ef5350; }
  .btn-danger:hover:not(:disabled) { background: #d32f2f; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #1b5e20; color: #c8e6c9; }
  .toast.error { background: #b71c1c; color: #ffcdd2; }

  /* 空状态 */
  .empty {
    grid-column: 1 / -1; text-align: center;
    padding: 60px 20px; color: #666;
  }
  .empty h3 { font-size: 18px; margin-bottom: 8px; color: #888; }
  .empty p { font-size: 14px; line-height: 1.8; }
  .empty code {
    background: #1a1a2e; padding: 2px 8px; border-radius: 4px;
    font-size: 13px; color: #8b83ff;
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔌 PLC 实时监控</h1>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">变量总数</div>
      <div class="value" id="statTotal">--</div>
    </div>
    <div class="stat-card">
      <div class="label">可写控制点</div>
      <div class="value" id="statWritable">--</div>
    </div>
    <div class="stat-card">
      <div class="label">最后更新</div>
      <div class="value" id="statTime" style="font-size:14px;">--</div>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">
      <h3>⏳ 等待 PLC 数据...</h3>
      <p>请确认：</p>
      <p>1. <code>plc-config.js</code> 中的 PLC IP 是否正确</p>
      <p>2. PLC 已开机并启用 PUT/GET 访问</p>
      <p>3. DB 块已取消"优化的块访问"</p>
      <p>4. 电脑和 PLC 在同一网段</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── 配置 ─────────────────────────────────────────────────
const CONFIG = {
  streamUrl: '/api/plc/stream',
  dataUrl: '/api/plc/data',
  writeUrl: '/api/plc/write',
  configUrl: '/api/plc/config',
};

// ─── 状态 ─────────────────────────────────────────────────
let plcData = {};
let plcConfig = { variables: [] };

// ─── 工具 ─────────────────────────────────────────────────
function formatVal(value, type) {
  if (value === null || value === undefined) return '--';
  if (type === 'bool') return '';
  if (type === 'real') return Number(value).toFixed(2);
  return value;
}

function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── 渲染 ─────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  const vars = plcConfig.variables || [];
  const total = vars.length;
  const writableCount = vars.filter(v => v.writable).length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statWritable').textContent = writableCount;

  const hasData = Object.keys(plcData).length > 0;

  if (!hasData) {
    grid.innerHTML = `
      <div class="empty">
        <h3>⏳ 等待 PLC 数据...</h3>
        <p>请确认上述配置无误后，重启服务端</p>
      </div>
    `;
    return;
  }

  document.getElementById('statTime').textContent = new Date().toLocaleTimeString();

  grid.innerHTML = vars.map(v => {
    const point = plcData[v.name];
    const val = point ? point.value : null;
    const display = formatVal(val, v.type);

    if (v.type === 'bool') {
      const isOn = val === true || val === 1;
      return `
        <div class="card">
          <div class="label">
            <span>${v.name}</span>
            <span class="tag ${v.writable ? 'writable' : ''}">${v.type.toUpperCase()}${v.writable ? ' ✏️' : ''}</span>
          </div>
          <div class="value ${isOn ? 'bool-true' : 'bool-false'}">
            ${val === null ? '--' : isOn ? '● ON' : '○ OFF'}
          </div>
          ${v.writable ? `
            <div class="controls">
              <button class="btn ${val ? 'btn-danger' : 'btn-success'}"
                      onclick="writePLC('${v.name}', ${val ? 0 : 1}, this)">
                ${val ? '关闭' : '开启'}
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    return `
      <div class="card">
        <div class="label">
          <span>${v.name}</span>
          <span class="tag ${v.writable ? 'writable' : ''}">${v.type.toUpperCase()}${v.writable ? ' ✏️' : ''}</span>
        </div>
        <div class="value">${display}</div>
        ${v.writable ? `
          <div class="controls">
            <input type="number" step="any" id="inp-${v.name}" value="${val ?? ''}" placeholder="值">
            <button class="btn btn-primary" onclick="writePLC('${v.name}', document.getElementById('inp-${v.name}').value, this)">
              写入
            </button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

// ─── 更新数据 ─────────────────────────────────────────────
function updateData(data) {
  plcData = data;
  render();
}

// ─── 写入 PLC ─────────────────────────────────────────────
async function writePLC(name, value, btn) {
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    const resp = await fetch('/api/plc/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, value: parseFloat(value) }),
    });
    const result = await resp.json();
    if (result.success) {
      showToast(`✅ ${name} = ${value} 写入成功`);
    } else {
      showToast(`❌ 写入失败: ${result.error}`, 'error');
    }
  } catch (err) {
    showToast(`❌ 网络错误: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '写入';
  }
}

// ─── 状态指示器 ───────────────────────────────────────────
function setConnected(ok) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.classList.toggle('connected', ok);
  text.textContent = ok ? 'PLC 已连接' : 'PLC 未连接';
}

// ─── SSE 连接 ─────────────────────────────────────────────
function connectSSE() {
  const evtSource = new EventSource('/api/plc/stream');

  evtSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      setConnected(true);
      updateData(data);
    } catch (e) {
      console.warn('SSE 数据解析失败:', e);
    }
  };

  evtSource.onerror = () => {
    setConnected(false);
    // 浏览器会自动重连
  };
}

// ─── 启动时加载配置 ──────────────────────────────────────
async function init() {
  try {
    const resp = await fetch('/api/plc/config');
    plcConfig = await resp.json();
    render();
  } catch (e) {
    console.warn('获取配置失败:', e);
  }

  // 先拉一次 REST 数据
  try {
    const resp = await fetch('/api/plc/data');
    const data = await resp.json();
    if (Object.keys(data).length > 0) {
      setConnected(true);
      updateData(data);
    }
  } catch (e) {
    // ignore
  }

  // 然后接 SSE 流
  connectSSE();
}

init();
</script>
</body>
</html>
